[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-resource-collector"
version = "0.1.0"
description = "Cross-platform HTML/PDF resource collector with durable jobs and optional AI audits"
requires-python = ">=3.12,<3.15"
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
network = ["httpx>=0.27"]
parsers = ["docling>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
resource-collector = "urcollector.cli:main"
resource-collector-gui = "urcollector.ui:main"

[tool.setuptools.packages.find]
where = ["src"]
